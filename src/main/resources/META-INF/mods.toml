modLoader="javafml"
loaderVersion="[47,)"
license="LGPL-3.0-only"
# issueTrackerURL="" # set once the repo has a home
[[mods]]
modId="embeddium"
version="${file.jarVersion}"
displayName="Emberbium"
logoFile="icon.png"
description='''
Emberbium is a performance-focused fork of Embeddium, which is a Forge port of Sodium.

The mod id remains "embeddium" so that existing addons (Oculus, Embeddium Extra, and others) continue to work unmodified.
'''
credits="embeddedt, Asek3, NanoLive, JellySquid & CaffeineMC"
authors="Misanthropy"

[[mods]]
modId = "rubidium"
version = "0.7.1"
displayName = "Rubidium (Emberbium)"
description = '''
Stub, to allow mods detecting Rubidium to function as expected.
'''

# Enforce new enough Oculus
[[dependencies.embeddium]]
modId = "oculus"
mandatory = false
versionRange = "(1.6.15,)"
ordering = "BEFORE"
side = "CLIENT"

# The new config screen supersedes TexTrue's Embeddium Options
[[dependencies.embeddium]]
modId = "textrues_embeddium_options"
mandatory = false
versionRange = "[0.0.0-NOT-COMPATIBLE]"
ordering = "BEFORE"
side = "CLIENT"
