# Emberbium's reported version MUST stay on upstream Embeddium's version line.
# Addons declare Forge dependencies against the embeddium mod id with lower-bound
# version ranges (createbetterfps needs [0.3.31-beta.53,), flywheel and flerovium
# [0.3.25,), oculus and mekalus [0.3.1,), cheaplighting [0.3,)). A fork version like
# 0.1.x sorts below all of them and every one of those mods refuses to load.
# Keep mod_version and this anchor matching upstream so we satisfy whatever upstream
# satisfies. Emberbium's identity lives in displayName, not the version number.
